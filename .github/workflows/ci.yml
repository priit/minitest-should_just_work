name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / minitest ${{ matrix.minitest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        minitest: ["~> 5.0", "~> 6.0"]
        exclude:
          # Minitest 6 requires Ruby >= 3.2.
          - ruby: "3.1"
            minitest: "~> 6.0"
    env:
      MINITEST_VERSION: ${{ matrix.minitest }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bundle install
      - run: bundle exec rake test

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: bundle install
      - run: bundle exec rubocop
